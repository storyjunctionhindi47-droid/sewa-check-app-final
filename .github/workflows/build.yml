name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter config --no-analytics
      - run: flutter create. --project-name sewa_check_app_final --overwrite
      - run: |
          cat > lib/main.dart << 'ENDOFFILE'
          import 'package:flutter/material.dart';
          void main() {
            runApp(MaterialApp(
              debugShowCheckedModeBanner: false,
              home: Scaffold(
                appBar: AppBar(title: Text('Sewa Check'), backgroundColor: Colors.orange),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.verified_user, size: 100, color: Colors.orange),
                      SizedBox(height: 20),
                      Text('Sewa Check App', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                      Text('Welcome', style: TextStyle(fontSize: 16)),
                    ],
                  ),
                ),
              ),
            ));
          }
          ENDOFFILE
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sewa-check-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
